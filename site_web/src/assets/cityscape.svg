<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c8e6c9" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  
  <!-- Background fill -->
  <rect width="1440" height="320" fill="url(#skyGrad)"/>
  
  <!-- Far buildings (lighter, smaller) -->
  <g fill="#b8d4c8" opacity="0.5">
    <!-- Far left cluster -->
    <rect x="50" y="140" width="30" height="180" rx="2"/>
    <rect x="85" y="160" width="25" height="160" rx="2"/>
    <rect x="115" y="120" width="20" height="200" rx="2"/>
    
    <!-- Far center-left -->
    <rect x="250" y="130" width="35" height="190" rx="2"/>
    <rect x="290" y="150" width="28" height="170" rx="2"/>
    
    <!-- Far center -->
    <rect x="550" y="110" width="25" height="210" rx="2"/>
    <rect x="580" y="140" width="30" height="180" rx="2"/>
    
    <!-- Far center-right -->
    <rect x="850" y="125" width="28" height="195" rx="2"/>
    <rect x="883" y="145" width="22" height="175" rx="2"/>
    
    <!-- Far right cluster -->
    <rect x="1100" y="135" width="32" height="185" rx="2"/>
    <rect x="1140" y="115" width="22" height="205" rx="2"/>
    <rect x="1300" y="150" width="25" height="170" rx="2"/>
    <rect x="1330" y="130" width="30" height="190" rx="2"/>
  </g>
  
  <!-- Mid buildings (medium tone) -->
  <g fill="#8fb8a3" opacity="0.7">
    <!-- Left cluster -->
    <rect x="20" y="170" width="45" height="150" rx="3"/>
    <rect x="70" y="150" width="35" height="170" rx="3"/>
    <rect x="110" y="130" width="50" height="190" rx="3"/>
    <rect x="165" y="160" width="30" height="160" rx="3"/>
    
    <!-- Center-left cluster -->
    <rect x="220" y="140" width="40" height="180" rx="3"/>
    <rect x="265" y="120" width="55" height="200" rx="3"/>
    <rect x="325" y="155" width="35" height="165" rx="3"/>
    
    <!-- Center cluster -->
    <rect x="500" y="125" width="45" height="195" rx="3"/>
    <rect x="550" y="100" width="60" height="220" rx="3"/>
    <rect x="615" y="145" width="40" height="175" rx="3"/>
    
    <!-- Center-right cluster -->
    <rect x="780" y="135" width="50" height="185" rx="3"/>
    <rect x="835" y="110" width="45" height="210" rx="3"/>
    <rect x="885" y="150" width="35" height="170" rx="3"/>
    
    <!-- Right cluster -->
    <rect x="1050" y="120" width="55" height="200" rx="3"/>
    <rect x="1110" y="145" width="40" height="175" rx="3"/>
    <rect x="1200" y="130" width="45" height="190" rx="3"/>
    <rect x="1250" y="155" width="35" height="165" rx="3"/>
    <rect x="1350" y="140" width="50" height="180" rx="3"/>
    <rect x="1405" y="160" width="35" height="160" rx="3"/>
  </g>
  
  <!-- Front buildings (darkest, tallest) -->
  <g fill="#3d6b54">
    <!-- Tall tower left -->
    <rect x="140" y="80" width="35" height="240" rx="2"/>
    <rect x="145" y="72" width="25" height="8" rx="2"/>
    <!-- antenna -->
    <rect x="155" y="55" width="5" height="17" rx="1"/>
    
    <!-- Skyscraper center-left -->
    <rect x="380" y="90" width="50" height="230" rx="3"/>
    <!-- windows -->
    <g fill="#5a9a7a" opacity="0.5">
      <rect x="388" y="100" width="8" height="6" rx="1"/>
      <rect x="400" y="100" width="8" height="6" rx="1"/>
      <rect x="412" y="100" width="8" height="6" rx="1"/>
      <rect x="388" y="115" width="8" height="6" rx="1"/>
      <rect x="400" y="115" width="8" height="6" rx="1"/>
      <rect x="412" y="115" width="8" height="6" rx="1"/>
      <rect x="388" y="130" width="8" height="6" rx="1"/>
      <rect x="400" y="130" width="8" height="6" rx="1"/>
      <rect x="412" y="130" width="8" height="6" rx="1"/>
    </g>
    
    <!-- Tall tower center -->
    <rect x="680" y="60" width="40" height="260" rx="2"/>
    <rect x="690" y="45" width="20" height="15" rx="8"/>
    <!-- antenna -->
    <rect x="698" y="28" width="4" height="17"/>
    
    <!-- Medium building center-right -->
    <rect x="950" y="105" width="55" height="215" rx="3"/>
    <!-- windows -->
    <g fill="#5a9a7a" opacity="0.5">
      <rect x="960" y="115" width="8" height="6" rx="1"/>
      <rect x="975" y="115" width="8" height="6" rx="1"/>
      <rect x="990" y="115" width="8" height="6" rx="1"/>
      <rect x="960" y="130" width="8" height="6" rx="1"/>
      <rect x="975" y="130" width="8" height="6" rx="1"/>
      <rect x="990" y="130" width="8" height="6" rx="1"/>
    </g>
    
    <!-- Tall right -->
    <rect x="1160" y="75" width="38" height="245" rx="2"/>
    <rect x="1165" y="68" width="28" height="7" rx="2"/>
    <rect x="1177" y="52" width="4" height="16"/>
  </g>
  
  <!-- Ground / road -->
  <rect x="0" y="290" width="1440" height="30" fill="#2d5a43" rx="0"/>
  
  <!-- Road line -->
  <g fill="#4a8a6a" opacity="0.6">
    <rect x="50" y="302" width="40" height="3" rx="1"/>
    <rect x="120" y="302" width="40" height="3" rx="1"/>
    <rect x="190" y="302" width="40" height="3" rx="1"/>
    <rect x="260" y="302" width="40" height="3" rx="1"/>
    <rect x="330" y="302" width="40" height="3" rx="1"/>
    <rect x="400" y="302" width="40" height="3" rx="1"/>
    <rect x="470" y="302" width="40" height="3" rx="1"/>
    <rect x="540" y="302" width="40" height="3" rx="1"/>
    <rect x="610" y="302" width="40" height="3" rx="1"/>
    <rect x="680" y="302" width="40" height="3" rx="1"/>
    <rect x="750" y="302" width="40" height="3" rx="1"/>
    <rect x="820" y="302" width="40" height="3" rx="1"/>
    <rect x="890" y="302" width="40" height="3" rx="1"/>
    <rect x="960" y="302" width="40" height="3" rx="1"/>
    <rect x="1030" y="302" width="40" height="3" rx="1"/>
    <rect x="1100" y="302" width="40" height="3" rx="1"/>
    <rect x="1170" y="302" width="40" height="3" rx="1"/>
    <rect x="1240" y="302" width="40" height="3" rx="1"/>
    <rect x="1310" y="302" width="40" height="3" rx="1"/>
    <rect x="1380" y="302" width="40" height="3" rx="1"/>
  </g>
  
  <!-- Bus (left side) -->
  <g transform="translate(180, 260)">
    <!-- Bus body -->
    <rect x="0" y="5" width="70" height="30" rx="6" fill="#30b566"/>
    <!-- Windshield -->
    <rect x="55" y="9" width="12" height="16" rx="3" fill="#a8e6c4"/>
    <!-- Windows -->
    <rect x="6" y="10" width="10" height="10" rx="2" fill="#a8e6c4"/>
    <rect x="20" y="10" width="10" height="10" rx="2" fill="#a8e6c4"/>
    <rect x="34" y="10" width="10" height="10" rx="2" fill="#a8e6c4"/>
    <!-- Wheels -->
    <circle cx="18" cy="37" r="5" fill="#1a3d2a"/>
    <circle cx="55" cy="37" r="5" fill="#1a3d2a"/>
    <!-- Wheel hubs -->
    <circle cx="18" cy="37" r="2" fill="#3d6b54"/>
    <circle cx="55" cy="37" r="2" fill="#3d6b54"/>
    <!-- Headlights -->
    <rect x="67" y="25" width="4" height="4" rx="1" fill="#ffa900"/>
  </g>
  
  <!-- Train / Tram (right side) -->
  <g transform="translate(1000, 255)">
    <!-- Train car 1 -->
    <rect x="0" y="5" width="90" height="32" rx="5" fill="#1162d9"/>
    <!-- Stripe -->
    <rect x="0" y="28" width="90" height="4" rx="0" fill="#0d4fb3"/>
    <!-- Windows -->
    <rect x="8" y="10" width="12" height="12" rx="2" fill="#7bb3f5"/>
    <rect x="24" y="10" width="12" height="12" rx="2" fill="#7bb3f5"/>
    <rect x="40" y="10" width="12" height="12" rx="2" fill="#7bb3f5"/>
    <rect x="56" y="10" width="12" height="12" rx="2" fill="#7bb3f5"/>
    <rect x="72" y="10" width="12" height="12" rx="2" fill="#7bb3f5"/>
    <!-- Headlight -->
    <rect x="85" y="14" width="5" height="8" rx="2" fill="#ffa900"/>
    <!-- Wheels -->
    <circle cx="20" cy="39" r="4.5" fill="#0a3a80"/>
    <circle cx="45" cy="39" r="4.5" fill="#0a3a80"/>
    <circle cx="70" cy="39" r="4.5" fill="#0a3a80"/>
    <!-- Wheel hubs -->
    <circle cx="20" cy="39" r="2" fill="#1162d9"/>
    <circle cx="45" cy="39" r="2" fill="#1162d9"/>
    <circle cx="70" cy="39" r="2" fill="#1162d9"/>
    
    <!-- Train car 2 -->
    <rect x="-100" y="5" width="95" height="32" rx="5" fill="#1162d9"/>
    <rect x="-100" y="28" width="95" height="4" rx="0" fill="#0d4fb3"/>
    <!-- Windows -->
    <rect x="-90" y="10" width="12" height="12" rx="2" fill="#7bb3f5"/>
    <rect x="-74" y="10" width="12" height="12" rx="2" fill="#7bb3f5"/>
    <rect x="-58" y="10" width="12" height="12" rx="2" fill="#7bb3f5"/>
    <rect x="-42" y="10" width="12" height="12" rx="2" fill="#7bb3f5"/>
    <rect x="-26" y="10" width="12" height="12" rx="2" fill="#7bb3f5"/>
    <!-- Wheels -->
    <circle cx="-80" cy="39" r="4.5" fill="#0a3a80"/>
    <circle cx="-55" cy="39" r="4.5" fill="#0a3a80"/>
    <circle cx="-30" cy="39" r="4.5" fill="#0a3a80"/>
    <!-- Wheel hubs -->
    <circle cx="-80" cy="39" r="2" fill="#1162d9"/>
    <circle cx="-55" cy="39" r="2" fill="#1162d9"/>
    <circle cx="-30" cy="39" r="2" fill="#1162d9"/>
    
    <!-- Connector between cars -->
    <rect x="-7" y="15" width="7" height="12" rx="1" fill="#0d4fb3"/>
    
    <!-- Rails -->
    <rect x="-110" y="44" width="210" height="2" fill="#2d5a43"/>
    <rect x="-110" y="43" width="210" height="1" fill="#4a8a6a" opacity="0.5"/>
  </g>
  
  <!-- Small bus (far right) -->
  <g transform="translate(1300, 265)">
    <rect x="0" y="5" width="50" height="24" rx="5" fill="#ffa900"/>
    <rect x="38" y="8" width="9" height="13" rx="2" fill="#ffe0a0"/>
    <rect x="5" y="9" width="8" height="8" rx="2" fill="#ffe0a0"/>
    <rect x="16" y="9" width="8" height="8" rx="2" fill="#ffe0a0"/>
    <rect x="27" y="9" width="8" height="8" rx="2" fill="#ffe0a0"/>
    <circle cx="13" cy="31" r="4" fill="#8a6500"/>
    <circle cx="40" cy="31" r="4" fill="#8a6500"/>
    <circle cx="13" cy="31" r="1.5" fill="#ffa900"/>
    <circle cx="40" cy="31" r="1.5" fill="#ffa900"/>
  </g>
  
  <!-- Trees -->
  <g fill="#2d8a52">
    <!-- Tree 1 -->
    <circle cx="460" cy="260" r="18"/>
    <rect x="456" y="270" width="8" height="20" fill="#1a5c34"/>
    
    <!-- Tree 2 -->
    <circle cx="740" cy="265" r="15"/>
    <rect x="737" y="273" width="6" height="17" fill="#1a5c34"/>
    
    <!-- Tree 3 -->
    <circle cx="1420" cy="262" r="16"/>
    <rect x="1417" y="271" width="6" height="19" fill="#1a5c34"/>
    
    <!-- Small bush -->
    <ellipse cx="30" cy="278" rx="14" ry="10"/>
    <ellipse cx="470" cy="280" rx="10" ry="7"/>
  </g>
  
  <!-- Clouds -->
  <g fill="white" opacity="0.15">
    <ellipse cx="200" cy="40" rx="60" ry="18"/>
    <ellipse cx="240" cy="35" rx="40" ry="14"/>
    <ellipse cx="800" cy="30" rx="50" ry="15"/>
    <ellipse cx="830" cy="25" rx="35" ry="12"/>
    <ellipse cx="1250" cy="45" rx="55" ry="16"/>
  </g>
</svg>
